<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Педагогический дневник</title>
<style>
  :root {
    --bg: #F7F9FB;
    --card: #FFFFFF;
    --text: #2F3A44;
    --muted: #7A8694;
    --line: #E1E7EC;
    --accent: #5B7C99;
    --accent-hover: #4A6680;
    --green: #D9EAD9;
    --yellow: #F5E6C2;
    --red: #EFD2D2;
    --green-fg: #3F6A3F;
    --yellow-fg: #8A6D1F;
    --red-fg: #8B3B3B;
    --radius: 12px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }

  header {
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }

  /* ── Вкладки ─────────────────────────────── */
  .tabs {
    display: flex;
    gap: 6px;
    background: #EDF1F5;
    padding: 4px;
    border-radius: var(--radius);
    margin-bottom: 20px;
  }
  .tabs button {
    flex: 1;
    background: transparent;
    border: 0;
    padding: 10px 12px;
    border-radius: 9px;
    font: inherit;
    color: var(--muted);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tabs button.active {
    background: var(--card);
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
    font-weight: 500;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  /* ── Форма ──────────────────────────────── */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 1px 3px rgba(20,30,40,.04);
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field select,
  .field input,
  .field textarea {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: #FBFCFD;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 10px 12px;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .field select:focus,
  .field input:focus,
  .field textarea:focus {
    border-color: var(--accent);
    background: #fff;
  }
  .field textarea {
    resize: vertical;
    min-height: 88px;
  }

  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 480px) {
    .row2 { grid-template-columns: 1fr; }
  }

  /* важность — три кнопки */
  .sev {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .sev button {
    font: inherit;
    padding: 10px 8px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: #FBFCFD;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
    font-size: 14px;
  }
  .sev button[data-v="green"] { }
  .sev button.active[data-v="green"] { background: var(--green); color: var(--green-fg); border-color: #C4DCC4; font-weight: 500; }
  .sev button.active[data-v="yellow"] { background: var(--yellow); color: var(--yellow-fg); border-color: #E6D4A0; font-weight: 500; }
  .sev button.active[data-v="red"]    { background: var(--red);    color: var(--red-fg);    border-color: #DFB8B8; font-weight: 500; }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }
  .btn {
    font: inherit;
    font-weight: 500;
    padding: 11px 18px;
    border-radius: 9px;
    border: 0;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    flex: 1;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover { background: #F1F5F8; color: var(--text); }

  .ok {
    margin-top: 14px;
    padding: 10px 14px;
    background: var(--green);
    color: var(--green-fg);
    border-radius: 9px;
    font-size: 14px;
    display: none;
  }
  .ok.show { display: block; }

  /* ── Итоги недели ───────────────────────── */
  .week-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .week-head h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
  }
  .week-head .sub {
    color: var(--muted);
    font-size: 13px;
  }

  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filters button {
    font: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
  }
  .filters button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .note {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    border-left: 4px solid var(--line);
    box-shadow: 0 1px 3px rgba(20,30,40,.04);
  }
  .note[data-v="green"]  { border-left-color: #8BBF8B; }
  .note[data-v="yellow"] { border-left-color: #E0C56A; }
  .note[data-v="red"]    { border-left-color: #D68A8A; }

  .note .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .note .who {
    font-weight: 600;
    color: var(--text);
    font-size: 13px;
  }
  .note .tag {
    background: #EDF1F5;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
  }
  .note[data-v="yellow"] .tag { background: var(--yellow); color: var(--yellow-fg); }
  .note[data-v="red"]    .tag { background: var(--red);    color: var(--red-fg); }
  .note .body {
    font-size: 14px;
    white-space: pre-wrap;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    font-size: 14px;
  }

  /* ── Блок «Итог недели» ─────────────────── */
  .summary {
    background: #EDF3F8;
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .summary h3 {
    margin: 0 0 10px;
    font-size: 14px;
    color: var(--muted);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .summary ul {
    margin: 0;
    padding-left: 18px;
  }
  .summary li { margin-bottom: 4px; font-size: 14px; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 32px;
  }

  /* Кнопка очистки данных для теста */
  .reset {
    margin-top: 24px;
    text-align: center;
  }
  .reset button {
    background: transparent;
    border: 0;
    color: #B0BAC4;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Педагогический дневник</h1>
    <p>Быстрые заметки для команды кампуса</p>
  </header>

  <div class="tabs">
    <button id="tabAdd" class="active" onclick="showTab('add')">Оставить заметку</button>
    <button id="tabWeek" onclick="showTab('week')">Итоги недели</button>
  </div>

  <!-- ═══ Панель 1: заметка ═══ -->
  <section id="panelAdd" class="panel active">
    <div class="card">
      <div class="field">
        <label>Педагог</label>
        <select id="teacher">
          <option value="">— выберите —</option>
          <option>Анна Борисовна</option>
          <option>Елена Васильевна</option>
          <option>Мария Цай</option>
          <option>Анастасия Борисовна</option>
          <option>Кирилл (англ.)</option>
          <option>Другой</option>
        </select>
      </div>

      <div class="row2">
        <div class="field">
          <label>Кому</label>
          <select id="targetType" onchange="onTargetChange()">
            <option value="student">Ученику</option>
            <option value="group">Группе</option>
            <option value="general">Общее</option>
          </select>
        </div>
        <div class="field">
          <label>Имя / группа</label>
          <input id="targetName" type="text" placeholder="Например, Алмаз Салаватов">
        </div>
      </div>

      <div class="field">
        <label>Важность</label>
        <div class="sev" id="sev">
          <button type="button" data-v="green">🟢 Обычное</button>
          <button type="button" data-v="yellow">🟡 Внимание</button>
          <button type="button" data-v="red">🔴 Срочно</button>
        </div>
      </div>

      <div class="field">
        <label>Что важно отметить</label>
        <textarea id="text" placeholder="Одно-два предложения. Например: «Не понял тему про одночлены, надо вернуться»."></textarea>
      </div>

      <div class="actions">
        <button class="btn btn-primary" onclick="saveNote()">Сохранить</button>
        <button class="btn btn-ghost" onclick="clearForm()">Очистить</button>
      </div>
      <div class="ok" id="ok">Заметка сохранена.</div>
    </div>
  </section>

  <!-- ═══ Панель 2: итоги недели ═══ -->
  <section id="panelWeek" class="panel">
    <div class="week-head">
      <div>
        <h2 id="weekTitle">Итоги недели</h2>
        <div class="sub" id="weekSub"></div>
      </div>
      <button class="btn btn-ghost" onclick="copyAsText()">Скопировать как текст</button>
    </div>

    <div id="summaryBox" class="summary" style="display:none">
      <h3>Сводка</h3>
      <ul id="summaryList"></ul>
    </div>

    <div class="filters" id="filters">
      <button class="active" data-f="all">Все</button>
      <button data-f="red">🔴 Срочные</button>
      <button data-f="yellow">🟡 Внимание</button>
      <button data-f="green">🟢 Обычные</button>
    </div>

    <div id="notesList"></div>
  </section>

  <div class="reset">
    <button onclick="resetAll()">очистить все заметки (для теста)</button>
  </div>

  <footer>v0.1 · интерфейс-прототип, данные хранятся в браузере</footer>
</div>

<script>
  /* ─── Состояние ─────────────────────────── */
  const STORAGE_KEY = "ped_journal_notes_v1";
  let notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  let currentSeverity = "green";
  let currentFilter = "all";

  /* ─── Вкладки ───────────────────────────── */
  function showTab(which) {
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
    if (which === "add") {
      document.getElementById("panelAdd").classList.add("active");
      document.getElementById("tabAdd").classList.add("active");
    } else {
      document.getElementById("panelWeek").classList.add("active");
      document.getElementById("tabWeek").classList.add("active");
      renderWeek();
    }
  }

  /* ─── Важность ──────────────────────────── */
  document.querySelectorAll("#sev button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#sev button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentSeverity = btn.dataset.v;
    });
  });
  document.querySelector('#sev button[data-v="green"]').classList.add("active");

  /* ─── Поле «Кому» ───────────────────────── */
  function onTargetChange() {
    const t = document.getElementById("targetType").value;
    const input = document.getElementById("targetName");
    if (t === "general") {
      input.value = "";
      input.disabled = true;
      input.placeholder = "— не нужно —";
    } else {
      input.disabled = false;
      input.placeholder = t === "student" ? "Имя ученика" : "Название группы";
    }
  }

  /* ─── Сохранение ────────────────────────── */
  function saveNote() {
    const teacher = document.getElementById("teacher").value.trim();
    const targetType = document.getElementById("targetType").value;
    const targetName = document.getElementById("targetName").value.trim();
    const text = document.getElementById("text").value.trim();

    if (!teacher) { alert("Выберите педагога"); return; }
    if (targetType !== "general" && !targetName) { alert("Укажите ученика или группу"); return; }
    if (!text) { alert("Напишите текст заметки"); return; }

    const note = {
      id: Date.now(),
      date: new Date().toISOString(),
      teacher,
      targetType,
      targetName: targetType === "general" ? "" : targetName,
      severity: currentSeverity,
      text
    };
    notes.push(note);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));

    const ok = document.getElementById("ok");
    ok.classList.add("show");
    setTimeout(() => ok.classList.remove("show"), 1800);

    clearForm();
  }

  function clearForm() {
    document.getElementById("text").value = "";
    document.getElementById("targetName").value = "";
    document.getElementById("targetName").focus();
  }

  function resetAll() {
    if (!confirm("Удалить все заметки? Действие нельзя отменить.")) return;
    notes = [];
    localStorage.removeItem(STORAGE_KEY);
    renderWeek();
  }

  /* ─── Итоги недели ──────────────────────── */
  function getWeekRange() {
    const now = new Date();
    const day = now.getDay() || 7; // Пн = 1
    const mon = new Date(now); mon.setDate(now.getDate() - day + 1); mon.setHours(0,0,0,0);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6); sun.setHours(23,59,59,999);
    return { mon, sun };
  }

  function isThisWeek(d) {
    const { mon, sun } = getWeekRange();
    return d >= mon && d <= sun;
  }

  function renderWeek() {
    const { mon, sun } = getWeekRange();
    const fmt = d => d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
    document.getElementById("weekTitle").textContent =
      "Итоги недели " + fmt(mon) + " – " + fmt(sun);

    const weekNotes = notes.filter(n => isThisWeek(new Date(n.date)));
    document.getElementById("weekSub").textContent =
      weekNotes.length === 0 ? "пока пусто" :
      "заметок за неделю: " + weekNotes.length;

    // Сводка
    const summaryBox = document.getElementById("summaryBox");
    const summaryList = document.getElementById("summaryList");
    summaryList.innerHTML = "";
    if (weekNotes.length > 0) {
      const redCount = weekNotes.filter(n => n.severity === "red").length;
      const yellowCount = weekNotes.filter(n => n.severity === "yellow").length;
      const teachers = [...new Set(weekNotes.map(n => n.teacher))].join(", ");
      const students = [...new Set(weekNotes.filter(n => n.targetName).map(n => n.targetName))];

      if (redCount) summaryList.innerHTML += `<li>🔴 Срочных заметок: <b>${redCount}</b></li>`;
      if (yellowCount) summaryList.innerHTML += `<li>🟡 Требуют внимания: <b>${yellowCount}</b></li>`;
      if (students.length) summaryList.innerHTML += `<li>Учеников упомянули: <b>${students.length}</b> — ${students.slice(0,5).join(", ")}${students.length>5?"…":""}</li>`;
      summaryList.innerHTML += `<li>Писали: ${teachers}</li>`;
      summaryBox.style.display = "block";
    } else {
      summaryBox.style.display = "none";
    }

    // Фильтр
    let list = weekNotes;
    if (currentFilter !== "all") list = list.filter(n => n.severity === currentFilter);
    list.sort((a, b) => {
      const rank = { red: 0, yellow: 1, green: 2 };
      if (rank[a.severity] !== rank[b.severity]) return rank[a.severity] - rank[b.severity];
      return new Date(b.date) - new Date(a.date);
    });

    const container = document.getElementById("notesList");
    if (list.length === 0) {
      container.innerHTML = `<div class="empty">Здесь появятся заметки этой недели.</div>`;
      return;
    }

    container.innerHTML = list.map(n => {
      const d = new Date(n.date);
      const dateStr = d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
      const timeStr = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
      const target = n.targetName ? `<span class="tag">${escapeHtml(n.targetName)}</span>` : `<span class="tag">общее</span>`;
      const label = { red: "срочно", yellow: "внимание", green: "обычное" }[n.severity];
      return `
        <div class="note" data-v="${n.severity}">
          <div class="meta">
            <span class="who">${escapeHtml(n.teacher)}</span>
            <span>${dateStr}, ${timeStr}</span>
            ${target}
            <span class="tag">${label}</span>
          </div>
          <div class="body">${escapeHtml(n.text)}</div>
        </div>
      `;
    }).join("");
  }

  /* ─── Фильтры ───────────────────────────── */
  document.querySelectorAll("#filters button").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll("#filters button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      currentFilter = b.dataset.f;
      renderWeek();
    });
  });

  /* ─── Копировать как текст ──────────────── */
  function copyAsText() {
    const weekNotes = notes.filter(n => isThisWeek(new Date(n.date)));
    if (weekNotes.length === 0) { alert("Пока нечего копировать"); return; }
    weekNotes.sort((a, b) => {
      const rank = { red: 0, yellow: 1, green: 2 };
      return rank[a.severity] - rank[b.severity];
    });
    const lines = weekNotes.map(n => {
      const icon = { red: "🔴", yellow: "🟡", green: "🟢" }[n.severity];
      const target = n.targetName ? ` [${n.targetName}]` : "";
      return `${icon} ${n.teacher}${target}: ${n.text}`;
    });
    const text = "Педагогический дневник — итоги недели\n\n" + lines.join("\n");
    navigator.clipboard.writeText(text).then(
      () => alert("Скопировано в буфер"),
      () => alert("Не удалось скопировать, скопируйте вручную")
    );
  }

  /* ─── Утилиты ───────────────────────────── */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /* ─── Демо-данные (только если пусто) ───── */
  if (notes.length === 0) {
    const now = new Date();
    notes = [
      { id: 1, date: new Date(now.getTime() - 86400000).toISOString(),
        teacher: "Мария Цай", targetType: "student", targetName: "Алмаз Салаватов",
        severity: "red", text: "Не понял тему про одночлены. Нужно вернуться и разобрать заново." },
      { id: 2, date: new Date(now.getTime() - 172800000).toISOString(),
        teacher: "Кирилл (англ.)", targetType: "student", targetName: "Мария Шихалдина",
        severity: "yellow", text: "Хорошо соображает, но последние две домашки не пришли. Проверить." },
      { id: 3, date: new Date(now.getTime() - 259200000).toISOString(),
        teacher: "Анна Борисовна", targetType: "group", targetName: "Группа 3",
        severity: "green", text: "Продуктивная неделя, много практики по геометрии." }
    ];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  }
</script>
</body>
</html>
